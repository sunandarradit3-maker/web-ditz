name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run DNS policy checks
        run: python3 tests/test_dns_filter.py

      - name: Build Android debug APK
        run: gradle --no-daemon --stacktrace clean :app:assembleDebug

      - name: Prepare APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DiTz-AdShield-v1.0.0-debug.apk
          sha256sum dist/DiTz-AdShield-v1.0.0-debug.apk | tee dist/SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DiTz-AdShield-v1.0.0-debug-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
